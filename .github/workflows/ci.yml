# Runs every test on each pull request and on main: game rules (unit), server and
# browser tests in Chromium, plus the @webkit-tagged tests in Safari's engine.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright 1.56.1 supports Ubuntu 24.04, not the newer default image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit
      - name: Game rules
        run: npm run test:unit
      - name: Server and browser tests
        run: npm run test:e2e
        env:
          RB_TEST_OUT: ${{ runner.temp }}/rowbusters-test-results
          # The browsers' own output in the log (e.g. why a page crashed).
          DEBUG: pw:browser
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ runner.temp }}/rowbusters-test-results
          retention-days: 14
