<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>BlocksNet — A: Classic</title>
<link rel="stylesheet" href="css/common.css">
<style>
  /* Option A — "Classic Portrait": the original TetriNET window squeezed onto a phone.
     Big own field on the left, the 5 opponents in a numbered column on the right,
     special bar + attacks/defense log below, physical-style button pad at the bottom. */
  body {
    display: flex; flex-direction: column;
    height: 100dvh;
    padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
    background: #0b0d12 radial-gradient(120% 60% at 50% 0%, #17203a 0%, transparent 70%);
  }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; border-bottom: 1px solid var(--line); background: #10141c;
  }
  .bar .logo { font: 900 18px "Arial Black", Impact, sans-serif; letter-spacing: -0.5px; }
  .bar .logo span { color: var(--red); }
  .bar .stats { display: flex; gap: 12px; font: 600 12px ui-monospace, Menlo, monospace; color: var(--dim); }
  .bar .stats b { color: var(--text); }
  .bar .tab { font-size: 12px; color: var(--dim); padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; touch-action: manipulation; }

  .main { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 8px 10px 4px; }
  .left { flex: 0 0 66%; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .me { flex: 0 1 auto; min-height: 0; width: 100%; aspect-ratio: 12 / 22; position: relative; }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .next-box { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .next-box span { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .next-box canvas { height: 34px; flex: 1; }
  .opps { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 5px; }
  .opp { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-radius: 4px; touch-action: manipulation; }
  .opp .tag { display: flex; gap: 3px; align-items: baseline; font-size: 10px; line-height: 13px; overflow: hidden; white-space: nowrap; }
  .opp .tag b { background: var(--blue); color: #fff; border-radius: 3px; padding: 0 3px; }
  .opp .tag em { font-style: normal; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .opp canvas { flex: 1; min-height: 0; }

  .specials { }
  .specials .lbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); margin-bottom: 2px; }
  .specials .lbl b { color: var(--accent); }
  .specials canvas { height: 18px; }

  .log { flex: 1 1 46px; min-height: 46px; padding: 3px 6px; overflow: hidden; font: 11px/14px ui-monospace, Menlo, monospace; background: #07090d; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; justify-content: flex-end; }

  .pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 6px 10px 8px; }
  .pad button {
    background: linear-gradient(#2a3040, #1b2030); border: 1px solid #3a4258; border-radius: 10px;
    height: 46px; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .pad .t { height: 34px; font-size: 13px; background: linear-gradient(#2a2f4a, #1d2138); }
  .pad .t.self { color: var(--green); }
  .pad .t.dead { opacity: 0.3; }
  .pad .wide2 { grid-column: span 2; }
  .pad .drop { background: linear-gradient(#c2352c, #8a1d18); border-color: #e3554c; }
  .pad .rot { background: linear-gradient(#2f5bff, #1a3ab8); border-color: #5b7cff; }

  /* Partyline sheet */
  .party { position: fixed; inset: auto 0 0 0; z-index: 40; height: 55dvh; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; padding: 10px 12px calc(10px + var(--safe-b)); transform: translateY(105%); transition: transform .25s; }
  .party.open { transform: none; }
  .party h3 { font-size: 14px; display: flex; justify-content: space-between; }
  .party .lines { flex: 1; overflow-y: auto; font: 12px/17px ui-monospace, Menlo, monospace; margin: 8px 0; }
  .party .lines div { white-space: normal; }
  .party form { display: flex; gap: 6px; }
  .party input { flex: 1; font-size: 16px; padding: 10px; border-radius: 10px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); -webkit-user-select: text; user-select: text; }
  .party button { background: var(--accent); color: #111; font-weight: 700; padding: 0 14px; border-radius: 10px; touch-action: manipulation; }
</style>
</head>
<body>
  <div class="bar">
    <div class="logo">Blocks<span>Net</span></div>
    <div class="stats">LINES <b id="lines">0</b> LVL <b id="level">1</b></div>
    <button class="tab" id="partyBtn">Partyline</button>
  </div>

  <div class="main">
    <div class="left">
      <div class="me"><canvas id="meCanvas"></canvas></div>
      <div class="specials">
        <div class="lbl"><span>Specials</span><b id="specName">—</b></div>
        <canvas id="spec"></canvas>
      </div>
      <div class="log" id="log"></div>
    </div>
    <div class="side">
      <div class="next-box"><span>Next</span><canvas id="next"></canvas></div>
      <div class="opps" id="opps"></div>
    </div>
  </div>

  <div class="pad">
    <div style="grid-column: span 6; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;" id="targets"></div>
    <button id="bL">&#9664;</button>
    <button id="bD">&#9660;</button>
    <button id="bR">&#9654;</button>
    <button id="bCCW" class="rot">&#10226;</button>
    <button id="bRot" class="rot">&#10227;</button>
    <button id="bDrop" class="drop">&#10515;</button>
  </div>

  <div class="party" id="party">
    <h3>Partyline <button class="tab" id="partyClose" style="font-size:12px;color:var(--dim)">Close</button></h3>
    <div class="lines" id="partyLines"></div>
    <form id="chatForm"><input id="chatIn" placeholder="Say something…" autocomplete="off"><button>Send</button></form>
  </div>

<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  const R = BN.render;
  const $ = id => document.getElementById(id);
  let oppEls = [];
  const logLines = [];

  function buildOpps(app) {
    const box = $('opps');
    box.innerHTML = '';
    oppEls = app.room.players.filter(p => p !== app.me).map(p => {
      const el = document.createElement('div');
      el.className = 'opp';
      el.innerHTML = `<div class="tag"><b>${p.slot}</b><em>${p.name}</em></div><canvas></canvas>`;
      el.addEventListener('click', () => app.act.use(p.slot));
      box.appendChild(el);
      return { p, el, canvas: el.querySelector('canvas') };
    });
    // Target buttons 1-6 (+ D for discard), like the number keys in the original.
    const t = $('targets');
    t.innerHTML = '';
    app.room.players.forEach(p => {
      const b = document.createElement('button');
      b.className = 't' + (p === app.me ? ' self' : '');
      b.textContent = p.slot;
      b.dataset.slot = p.slot;
      app.bindHold(b, () => app.act.use(p.slot), { repeat: false });
      t.appendChild(b);
    });
    const d = document.createElement('button');
    d.className = 't'; d.textContent = 'D';
    app.bindHold(d, app.act.discard, { repeat: false });
    t.appendChild(d);
  }

  function addLog(e) {
    logLines.push(e);
    if (logLines.length > 200) logLines.shift();
    const div = `<div class="log-line log-${e.kind}">${e.text.replace(/</g, '&lt;')}</div>`;
    const log = $('log');
    log.insertAdjacentHTML('beforeend', div);
    while (log.children.length > 12) log.firstChild.remove();
    const pl = $('partyLines');
    pl.insertAdjacentHTML('beforeend', div);
    pl.scrollTop = pl.scrollHeight;
  }

  const app = BN.app({
    title: 'Option A · Classic Portrait',
    subtitle: 'Faithful to the 1997 layout. Buttons for moves, number buttons 1–6 fire your first special at that player, D discards it. Tap an opponent field to target it too.',
    onSetup: buildOpps,
    render(app) {
      const me = app.me;
      R.drawField($('meCanvas'), me, { grid: true, frame: '#3a4258', valign: 'top' });
      R.drawNext($('next'), me.next);
      R.drawSpecials($('spec'), me.inv);
      $('specName').textContent = me.inv[0] ? BN.SPECIAL_INFO[me.inv[0]].name : '—';
      $('lines').textContent = me.lines;
      $('level').textContent = me.level;
      for (const o of oppEls) R.drawField(o.canvas, o.p, { valign: 'top', highlight: me.inv.length && o.p.alive ? 'rgba(255,204,51,.6)' : null });
      document.querySelectorAll('#targets .t[data-slot]').forEach(b => {
        const p = app.room.bySlot(+b.dataset.slot);
        b.classList.toggle('dead', !p || !p.alive);
      });
    },
  });
  app.room.on('log', addLog);

  app.bindHold($('bL'), app.act.left);
  app.bindHold($('bR'), app.act.right);
  app.bindHold($('bD'), app.act.soft);
  app.bindHold($('bRot'), app.act.rotate, { repeat: false });
  app.bindHold($('bCCW'), app.act.rotateCCW, { repeat: false });
  app.bindHold($('bDrop'), app.act.drop, { repeat: false });

  $('partyBtn').addEventListener('click', () => $('party').classList.add('open'));
  $('partyClose').addEventListener('click', () => $('party').classList.remove('open'));
  $('chatForm').addEventListener('submit', e => { e.preventDefault(); app.act.say($('chatIn').value); $('chatIn').value = ''; });
})();
</script>
</body>
</html>
