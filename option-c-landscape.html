<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>BlocksNet — C: Arcade</title>
<link rel="stylesheet" href="css/common.css">
<style>
  /* Option C — "Landscape Arcade": hold the phone like a handheld console.
     Left thumb: D-pad. Right thumb: A/B rotate buttons. Centre: your field and a
     3x2 board of opponents you tap to fire specials at. Fits all 6 fields at once. */
  body {
    height: 100dvh; display: flex; align-items: stretch;
    padding: calc(6px + var(--safe-t)) calc(8px + var(--safe-r)) calc(6px + var(--safe-b)) calc(8px + var(--safe-l));
    gap: 10px;
    background: #120a1e radial-gradient(80% 120% at 50% 50%, #241336 0%, #0b0612 80%);
  }
  .thumb { flex: 0 0 clamp(108px, 17vw, 160px); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }

  .dpad { position: relative; width: 100%; aspect-ratio: 1; max-width: 150px; }
  .dpad button { position: absolute; width: 36%; height: 36%; background: #2b2238; border: 1px solid #4a3b60; display: grid; place-items: center; font-size: 18px; color: #cbb8ff; }
  .dpad .u { left: 32%; top: 0; border-radius: 10px 10px 4px 4px; }
  .dpad .d { left: 32%; bottom: 0; border-radius: 4px 4px 10px 10px; }
  .dpad .l { left: 0; top: 32%; border-radius: 10px 4px 4px 10px; }
  .dpad .r { right: 0; top: 32%; border-radius: 4px 10px 10px 4px; }
  .dpad .c { left: 32%; top: 32%; width: 36%; height: 36%; position: absolute; background: #2b2238; }
  .thumb .small { display: flex; gap: 8px; }
  .thumb .small button { font-size: 11px; font-weight: 700; color: var(--dim); background: #1c1528; border: 1px solid #3a2d4e; border-radius: 999px; padding: 6px 12px; }

  .ab { position: relative; width: 100%; max-width: 150px; aspect-ratio: 1; }
  .ab button { position: absolute; width: 50%; aspect-ratio: 1; border-radius: 50%; font: 900 22px system-ui, sans-serif; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.25); }
  .ab .a { right: 0; top: 8%; background: radial-gradient(circle at 35% 30%, #ff6b6b, #b0222a); }
  .ab .b { left: 0; bottom: 8%; background: radial-gradient(circle at 35% 30%, #6b8bff, #2440b0); }
  .ab button small { display: block; font-size: 9px; font-weight: 700; opacity: .8; margin-top: -4px; }

  .me { flex: 0 0 auto; height: 100%; aspect-ratio: 12/22; position: relative; }
  .me canvas { border-radius: 6px; box-shadow: 0 0 0 2px #5b3f84, 0 0 30px rgba(140, 80, 255, .25); }

  .board { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .top { display: flex; align-items: center; gap: 8px; }
  .top canvas { height: 18px; flex: 1; }
  .top .name { font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; min-width: 90px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .cell { position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: rgba(255,255,255,0.03); border: 1px solid #2c2140; border-radius: 8px; padding: 3px; touch-action: manipulation; }
  .cell.armed { border-color: rgba(255,204,51,.5); }
  .cell .tag { font-size: 10px; display: flex; gap: 4px; white-space: nowrap; overflow: hidden; }
  .cell .tag b { color: #fff; background: #7a4fd0; border-radius: 4px; padding: 0 4px; }
  .cell .tag em { font-style: normal; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .cell canvas { flex: 1; min-height: 0; }
  .info { justify-content: space-around; align-items: center; text-align: center; font: 700 11px ui-monospace, Menlo, monospace; color: var(--dim); }
  .info b { display: block; font-size: 18px; color: var(--text); }
  .info canvas { flex: none; width: 70%; height: 36px; }
  .log { height: 30px; overflow: hidden; font: 11px/15px ui-monospace, Menlo, monospace; display: flex; flex-direction: column; justify-content: flex-end; }

  .rotate-hint { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b0612; text-align: center; padding: 24px; }
  .rotate-hint .phone { width: 44px; height: 76px; border: 3px solid var(--accent); border-radius: 9px; animation: turn 1.8s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0) } 60%, 100% { transform: rotate(-90deg) } }
  .rotate-hint p { color: var(--dim); font-size: 14px; max-width: 260px; }
  @media (orientation: portrait) { .rotate-hint { display: flex; } }
</style>
</head>
<body>
  <div class="thumb">
    <div class="dpad">
      <button class="u" id="bUp" aria-label="Drop">&#9650;</button>
      <button class="l" id="bL" aria-label="Left">&#9664;</button>
      <div class="c"></div>
      <button class="r" id="bR" aria-label="Right">&#9654;</button>
      <button class="d" id="bD" aria-label="Down">&#9660;</button>
    </div>
    <div class="small"><button id="bSelf">ME</button><button id="bToss">TOSS</button></div>
  </div>

  <div class="me"><canvas id="meCanvas"></canvas></div>

  <div class="board">
    <div class="top"><span class="name" id="specName">No special</span><canvas id="spec"></canvas></div>
    <div class="grid" id="grid"></div>
    <div class="log" id="log"></div>
  </div>

  <div class="thumb">
    <div class="ab">
      <button class="a" id="bA">A<small>↻</small></button>
      <button class="b" id="bB">B<small>↺</small></button>
    </div>
  </div>

  <div class="rotate-hint">
    <div class="phone"></div>
    <b>Turn your phone sideways</b>
    <p>Option C is a landscape, two-thumb console layout. Unlock rotation and hold the phone horizontally.</p>
    <a class="bn-back" href="index.html">&larr; all UI options</a>
  </div>

<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/vendor/peerjs.min.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  const R = BN.render;
  const $ = id => document.getElementById(id);
  let cells = [];

  function build(app) {
    const grid = $('grid');
    grid.innerHTML = '';
    const opps = app.room.players.filter(p => p !== app.me);
    cells = [];
    for (let i = 0; i < 5; i++) {
      const p = opps[i];
      const el = document.createElement('div');
      el.className = 'cell';
      if (p) {
        el.innerHTML = `<div class="tag"><b>${p.slot}</b><em>${p.name}</em></div><canvas></canvas>`;
        el.addEventListener('click', () => app.act.use(p.slot));
        cells.push({ p, el, canvas: el.querySelector('canvas') });
      } else {
        el.style.opacity = .3;
        el.innerHTML = '<div class="tag"><em>open slot</em></div>';
      }
      grid.appendChild(el);
    }
    const info = document.createElement('div');
    info.className = 'cell info';
    info.innerHTML = '<canvas id="next"></canvas><div>LINES<b id="lines">0</b></div><div>LEVEL<b id="level">1</b></div>';
    grid.appendChild(info);
  }

  const app = BN.app({
    title: 'Option C · Landscape Arcade',
    landscape: true,
    subtitle: 'Hold the phone sideways like a handheld. D-pad: ◀ ▶ move, ▼ soft drop, ▲ hard drop. A/B rotate. Tap any field to fire your special; ME uses it on yourself.',
    onSetup: build,
    render(app) {
      const me = app.me;
      R.drawField($('meCanvas'), me, { grid: true, ghost: true, bg: '#07040c' });
      R.drawSpecials($('spec'), me.inv);
      $('specName').textContent = me.inv[0] ? BN.SPECIAL_INFO[me.inv[0]].name : 'No special';
      const next = $('next');
      if (next) R.drawNext(next, me.next);
      if ($('lines')) { $('lines').textContent = me.lines; $('level').textContent = me.level; }
      for (const c of cells) {
        c.el.classList.toggle('armed', !!me.inv.length && c.p.alive);
        R.drawField(c.canvas, c.p, { bg: '#07040c', valign: 'top' });
      }
    },
  });

  app.room.on('log', e => {
    const log = $('log');
    log.insertAdjacentHTML('beforeend', `<div class="log-line log-${e.kind}">${e.text.replace(/</g, '&lt;')}</div>`);
    while (log.children.length > 2) log.firstChild.remove();
  });

  app.bindHold($('bL'), app.act.left);
  app.bindHold($('bR'), app.act.right);
  app.bindHold($('bD'), app.act.soft);
  app.bindHold($('bUp'), app.act.drop, { repeat: false });
  app.bindHold($('bA'), app.act.rotate, { repeat: false });
  app.bindHold($('bB'), app.act.rotateCCW, { repeat: false });
  app.bindHold($('bSelf'), () => app.act.use(app.me.slot), { repeat: false });
  app.bindHold($('bToss'), app.act.discard, { repeat: false });
})();
</script>
</body>
</html>
