<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#160B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  /* Portrait layout for up to 4 players: a slim status line on top so the playfield gets
     the space, your field on the left, the 3 opponents stacked on the right, special bar and
     attack log under your field, and a large button pad at the bottom. */
  body {
    display: flex; flex-direction: column;
    /* --app-h is the real window height, measured by script below: iOS Home Screen apps
       report 100dvh about one status bar too short, which left an empty band at the bottom. */
    height: var(--app-h, 100dvh);
    padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
    background: var(--bg) radial-gradient(120% 60% at 50% 0%, #2A1660 0%, transparent 70%);
  }
  .bar {
    flex: none; height: 26px; display: flex; align-items: center; gap: 10px;
    padding: 0 6px 0 10px; border-bottom: 1px solid var(--line); background: var(--bar);
  }
  .bar .logo { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .bar .logo .rb-mark { width: 17px; height: 17px; }
  .bar .stats { flex: 1; display: flex; justify-content: center; gap: 12px; font: 600 11px var(--font); letter-spacing: .06em; color: var(--dim); }
  .bar .stats b { font-variant-numeric: tabular-nums; }
  .bar .stats b { color: var(--text); }
  .bar .stats i, .watchbar span i { font-style: normal; }
  .bar .chat { position: relative; width: 34px; height: 24px; display: grid; place-items: center; font-size: 14px; border-radius: 6px; touch-action: manipulation; }
  .bar .chat.unread::after { content: ""; position: absolute; top: 3px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .main { flex: 1; min-height: 0; display: flex; gap: 6px; padding: 5px 6px 3px; }
  .left { flex: 0 0 70%; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .me { flex: 0 1 auto; min-height: 0; width: 100%; aspect-ratio: 12 / 22; position: relative; }
  .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .next-box { flex: none; display: flex; align-items: center; justify-content: center; height: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .next-box canvas { height: 30px; width: 100%; }
  .opps { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .opp { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-radius: 4px; touch-action: manipulation; }
  .opp .tag { display: flex; gap: 3px; align-items: baseline; font-size: 10px; line-height: 13px; overflow: hidden; white-space: nowrap; }
  .opp .tag b { background: var(--line-2); color: #fff; border-radius: 3px; padding: 0 3px; }
  .opp .tag em { font-style: normal; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .opp .tag b.tmA { background: #2f7bff; } .opp .tag b.tmB { background: #e0533d; }   /* teams room */
  .opp.mate .tag em { color: var(--accent); }
  .opp canvas { flex: 1; min-height: 0; }
  .opp { cursor: pointer; }
  /* Brief lime flash on the opponent you just fired a special at. */
  .opp.fired canvas { animation: fired .35s ease-out 1; }
  @keyframes fired { 0% { box-shadow: 0 0 0 2px var(--accent), 0 0 14px 2px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* One blink of a coloured border when an opponent hits you with a special. */
  .me::after, .opp::after {
    content: ""; position: absolute; inset: -3px; pointer-events: none; opacity: 0;
    border: 3px solid var(--hit, #ff4040); border-radius: 6px;
    box-shadow: 0 0 14px 2px var(--hit, #ff4040), inset 0 0 14px 2px var(--hit, #ff4040);
  }
  .opp::after { inset: 12px -2px -2px; border-width: 2px; box-shadow: 0 0 8px 1px var(--hit, #ff4040); }
  .me.hit::after, .opp.hit::after { animation: hitblink .75s ease-out 1; }
  @keyframes hitblink { 0% { opacity: 0 } 12% { opacity: 1 } 55% { opacity: 1 } 100% { opacity: 0 } }

  /* Action ticker: the last 3 events, newest at the bottom. Lines slide up and fade as
     newer ones arrive, and fade away on their own after a few seconds. Tap for history. */
  .log { --lh: 16px; position: relative; flex: 0 0 auto; height: calc(var(--lh) * 3 + 8px); overflow: hidden; background: var(--well); border: 1px solid var(--line); border-radius: 6px; touch-action: manipulation; }
  .log .ln {
    position: absolute; left: 7px; right: 7px; bottom: 4px; height: var(--lh);
    font: 600 12.5px/var(--lh) var(--font);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: transform .45s ease-out, opacity .6s ease-out;
    will-change: transform, opacity;
  }

  /* Watching someone else's game: no controls, a bar instead. */
  .watchbar { display: none; flex: none; align-items: center; gap: 10px; padding: 10px 12px calc(10px + var(--safe-b)); border-top: 1px solid var(--line); background: var(--bar); }
  .watchbar span { flex: 1; font-size: 14px; color: var(--dim); }
  .watchbar b { color: var(--text); }
  .watchbar small { display: block; font-size: 11px; }
  .watchbar button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-weight: 700; color: var(--text); touch-action: manipulation; }
  body.watching .watchbar { display: flex; }
  body.watching .pad { display: none; }
  .pad { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 4px 6px 6px; }
  .pad .row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .pad button {
    background: linear-gradient(#2E1B5E, #1F1240); border: 1px solid var(--line-2); border-radius: 12px; color: var(--text);
    height: var(--btn-h, 64px); font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .pad .t { height: 40px; font-size: 16px; background: linear-gradient(#271650, #1C1039); }
  .pad .t.self { color: var(--accent); }
  .pad .t.dead { opacity: 0.3; }
  .pad .drop { background: linear-gradient(#FF2E88, #C41866); border-color: #FF8AC0; color: #fff; }
  .pad .rot { background: linear-gradient(#C6FF3D, #8FC71C); border-color: #E2FF9A; color: var(--ink); font-size: 30px; }

  /* Partyline sheet */
  .party { position: fixed; inset: auto 0 0 0; z-index: 40; height: 55dvh; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; padding: 10px 12px calc(10px + var(--safe-b)); transform: translateY(105%); transition: transform .25s; }
  .party.open { transform: none; }
  .party h3 { font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .party h3 button { font-size: 12px; color: var(--dim); padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; touch-action: manipulation; }
  .party .lines { flex: 1; overflow-y: auto; font: 13px/18px var(--font); margin: 8px 0; }
  .party .lines div { white-space: normal; }
  .party form { display: flex; gap: 6px; }
  .party input { flex: 1; font-size: 16px; padding: 10px; border-radius: 10px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); -webkit-user-select: text; user-select: text; }
  .party form button { background: var(--accent); color: var(--ink); font-weight: 700; padding: 0 14px; border-radius: 10px; touch-action: manipulation; }
</style>
</head>
<body>
<script>
  // Saved data (player id, nickname, settings, mute) used to be stored under 'bn.' keys,
  // before the game was renamed Rowbusters: copy it to the 'rb.' keys once.
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('bn.') && localStorage.getItem('rb.' + k.slice(3)) == null) localStorage.setItem('rb.' + k.slice(3), localStorage.getItem(k));
    }
  } catch (e) { /* storage unavailable */ }

  // The game lives at rowbusters.com. Each web address has its own saved data, so the GitHub
  // Pages copy sends players there with theirs (player id, nickname, settings) in the address
  // after '#', which never leaves the phone; rowbusters.com stores it and removes it from the
  // address bar. Only once rowbusters.com runs the game, only from the lobby, and not with ?stay.
  (function () {
    const HOME = 'https://rowbusters.com/';
    const KEYS = ['rb.pid', 'rb.settings', 'rb.muted', 'rb.winlist'];
    const m = location.hash.match(/^#carry=([A-Za-z0-9_-]+)$/);
    if (m) {
      try {
        const d = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
        for (const k of KEYS) if (typeof d[k] === 'string' && localStorage.getItem(k) == null) localStorage.setItem(k, d[k]);
      } catch (e) { /* bad or no storage */ }
      history.replaceState(null, '', location.pathname + location.search);
    }
    if (!/\.github\.io$/.test(location.hostname) || /[?&](stay|server)\b/.test(location.search)) return;
    fetch(HOME + 'health', { cache: 'no-store' }).then(r => r.json()).then(h => {
      if (!h || h.service !== 'rowbusters') return;
      const app = window.RB && RB.current;
      if (app && (app.room.running || (app.session && app.session()))) return;   // mid-game or in a room
      const d = {};
      try { for (const k of KEYS) { const v = localStorage.getItem(k); if (v != null) d[k] = v; } } catch (e) { /* none */ }
      const carry = btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      location.replace(HOME + location.search + '#carry=' + carry);
    }).catch(() => { /* rowbusters.com not live yet: stay here */ });
  })();

  (function () {
    const set = () => document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    set();
    addEventListener('resize', set);
    addEventListener('orientationchange', () => setTimeout(set, 300));
    if (window.visualViewport) visualViewport.addEventListener('resize', set);
  })();
</script>
  <div class="bar">
    <div class="logo" id="barLogo" role="img" aria-label="Rowbusters"></div>
    <div class="stats"><span><i data-i18n="bar.lines">LINES</i> <b id="lines">0</b></span><span><i data-i18n="bar.level">LEVEL</i> <b id="level">1</b></span></div>
    <button class="chat" id="muteBtn" aria-label="Sound on/off" data-i18n-aria="aria.sound">&#128264;</button>
    <button class="chat" id="partyBtn" aria-label="Partyline chat" data-i18n-aria="aria.party">&#128172;</button>
  </div>

  <div class="main">
    <div class="left">
      <div class="me"><canvas id="meCanvas"></canvas></div>
      <div class="log" id="log"></div>
    </div>
    <div class="side">
      <div class="next-box"><canvas id="next" aria-label="Next piece" data-i18n-aria="aria.next"></canvas></div>
      <div class="opps" id="opps"></div>
    </div>
  </div>

  <div class="watchbar" id="watchbar">
    <span>&#128065; <i data-i18n="watch.watching">Watching</i> <b id="watchName"></b><small data-i18n="watch.tip">tap a small field to follow that player</small></span>
    <button id="watchLeave" type="button" data-i18n="watch.leave">Leave</button>
  </div>

  <div class="pad">
    <div class="row" id="targets"></div>
    <div class="row">
      <button id="bL" aria-label="Move left" data-i18n-aria="aria.left">&#9664;</button>
      <button id="bD" aria-label="Soft drop" data-i18n-aria="aria.soft">&#9660;</button>
      <button id="bR" aria-label="Move right" data-i18n-aria="aria.right">&#9654;</button>
      <button id="bRot" class="rot" aria-label="Rotate" data-i18n-aria="aria.rotate">&#10227;</button>
      <button id="bDrop" class="drop" aria-label="Hard drop" data-i18n-aria="aria.drop">&#10515;</button>
    </div>
  </div>

  <div class="party" id="party">
    <h3><span data-i18n="on.partyline">Partyline</span> <button id="partyClose" data-i18n="close">Close</button></h3>
    <div class="lines" id="partyLines"></div>
    <form id="chatForm"><input id="chatIn" placeholder="Say something…" data-i18n-ph="chat.placeholder" autocomplete="off"><button data-i18n="chat.send">Send</button></form>
  </div>

<script src="js/i18n.js?v=20261028d"></script>
<script src="js/i18n/en.js?v=20261028d"></script>
<script src="js/i18n/es.js?v=20261028d"></script>
<script src="js/i18n/pt.js?v=20261028d"></script>
<script src="js/i18n/fr.js?v=20261028d"></script>
<script src="js/i18n/de.js?v=20261028d"></script>
<script src="js/engine.js?v=20261028d"></script>
<script src="js/render.js?v=20261028d"></script>
<script src="js/vendor/peerjs.min.js?v=20261028d"></script>
<script src="js/config.js?v=20261028d"></script>
<script src="js/net.js?v=20261028d"></script>
<script src="js/account.js?v=20261028d"></script>
<script src="js/sound.js?v=20261028d"></script>
<script src="js/statsimage.js?v=20261028d"></script>
<script src="js/app.js?v=20261028d"></script>
<script>
(function () {
  const R = RB.render;
  const $ = id => document.getElementById(id);
  $('barLogo').innerHTML = RB.LOGO;
  RB.translatePage();
  let oppEls = [];
  const logLines = [];

  function buildOpps(app) {
    const box = $('opps');
    box.innerHTML = '';
    oppEls = app.room.players.filter(p => p !== app.me).map(p => {
      const el = document.createElement('div');
      el.className = 'opp';
      const mate = p.team && app.me && p.team === app.me.team;
      el.innerHTML = `<div class="tag"><b class="${p.team ? 'tm' + p.team : ''}">${p.slot}${p.team || ''}</b><em>${mate ? RB.t('game.partner') : ''}${p.name}</em></div><canvas></canvas>`;
      if (mate) el.classList.add('mate');
      // Tap an opponent's field to fire your next special at them. It reacts on touch-down, like
      // the buttons: a 'click' arrives late on phones and is dropped right after a button press.
      el.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        if (app.watching) { app.follow(p); return; }
        if (app.act.use(p.slot)) {
          el.classList.remove('fired'); void el.offsetWidth; el.classList.add('fired');
          RB.haptic(15);
        }
      });
      box.appendChild(el);
      return { p, el, canvas: el.querySelector('canvas') };
    });
    // Target buttons 1-6 (+ D for discard), mirroring the number-key targeting.
    const t = $('targets');
    t.innerHTML = '';
    app.room.players.forEach(p => {
      const b = document.createElement('button');
      b.className = 't' + (p === app.me ? ' self' : '');
      b.textContent = p.slot;
      b.dataset.slot = p.slot;
      app.bindHold(b, () => app.act.use(p.slot), { repeat: false });
      t.appendChild(b);
    });
    const d = document.createElement('button');
    d.className = 't'; d.textContent = 'D';
    app.bindHold(d, app.act.discard, { repeat: false });
    t.appendChild(d);
  }

  // ---- 3-line ticker
  const TICK_MAX = 3, TICK_LIFE = 7000, TICK_OPACITY = [1, 0.7, 0.45];
  const ticker = [];   // newest first
  const lineH = () => parseFloat(getComputedStyle($('log')).getPropertyValue('--lh')) || 16;
  function placeTicker() {
    const h = lineH();
    ticker.slice().forEach((el, i) => {
      if (i >= TICK_MAX) { retire(el); return; }
      el.style.transform = `translateY(${-i * h}px)`;
      el.style.opacity = TICK_OPACITY[i];
    });
  }
  function retire(el) {
    const i = ticker.indexOf(el);
    if (i < 0) return;
    ticker.splice(i, 1);
    clearTimeout(el._t);
    el.style.transform = `translateY(${-(i + 0.6) * lineH()}px)`;
    el.style.opacity = 0;
    setTimeout(() => el.remove(), 650);
    placeTicker();
  }
  function tick(e) {
    const el = document.createElement('div');
    el.className = `ln log-line log-${e.kind}`;
    el.textContent = e.text;
    el.style.transform = `translateY(${lineH()}px)`;
    el.style.opacity = 0;
    $('log').appendChild(el);
    void el.offsetWidth;            // start the slide-in from below
    ticker.unshift(el);
    el._t = setTimeout(() => retire(el), TICK_LIFE);
    placeTicker();
  }

  function addLog(e) {
    logLines.push(e);
    if (logLines.length > 200) logLines.shift();
    const div = `<div class="log-line log-${e.kind}">${e.text.replace(/</g, '&lt;')}</div>`;
    tick(e);
    const pl = $('partyLines');
    pl.insertAdjacentHTML('beforeend', div);
    pl.scrollTop = pl.scrollHeight;
    if (e.kind === 'chat' && !$('party').classList.contains('open')) $('partyBtn').classList.add('unread');
  }

  const app = RB.app({
    title: RB.t('lobby.title'),
    orientation: 'portrait',
    subtitle: RB.t('lobby.help'),
    onSetup: buildOpps,
    render(app) {
      const me = app.me;
      R.drawField($('meCanvas'), me, { grid: true, frame: '#3D2870', valign: 'top', inv: me.inv });
      R.drawNext($('next'), app.watching ? null : me.next);
      if (app.watching) $('watchName').textContent = me.name;
      $('lines').textContent = me.lines;
      $('level').textContent = me.level;
      for (const o of oppEls) R.drawField(o.canvas, o.p, { valign: 'top', highlight: me.inv.length && o.p.alive ? 'rgba(198,255,61,.6)' : null });
      document.querySelectorAll('#targets .t[data-slot]').forEach(b => {
        const p = app.room.bySlot(+b.dataset.slot);
        b.classList.toggle('dead', !p || !p.alive);
      });
    },
  });
  app.room.on('log', addLog);

  // Border blink (once) when a special lands: on your field if an opponent sent it,
  // on an opponent's mini field when they are the target.
  function blink(el, color) {
    if (!el) return;
    el.style.setProperty('--hit', color);
    el.classList.remove('hit');
    void el.offsetWidth;            // restart the animation if it is already running
    el.classList.add('hit');
  }
  app.room.on('special', e => {
    const color = RB.SPECIAL_INFO[e.special].color;
    if (e.target === app.me) { if (e.from !== app.me) blink(document.querySelector('.me'), color); }
    else { const o = oppEls.find(x => x.p === e.target); if (o) blink(o.el, color); }
  });
  document.addEventListener('animationend', ev => { if (ev.animationName === 'hitblink') ev.target.classList.remove('hit'); });

  // Give your own field as much room as the screen allows: as tall as possible after the
  // special bar and a 2-line log, but leaving at least ~24% of the width for opponents.
  function sizeField(again = true) {
    const main = document.querySelector('.main').getBoundingClientRect();
    const reserved = $('log').getBoundingClientRect().height + 4 + 4;
    const byHeight = (main.height - reserved) * 12 / 22;
    const w = Math.max(main.width * 0.6, Math.min(main.width * 0.76, byHeight));
    document.querySelector('.left').style.flexBasis = Math.floor(w) + 'px';
    // On tall screens the field hits its width limit first; give the spare height to the
    // move/rotate/drop buttons (64px up to 88px) instead of leaving a gap.
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--btn-h')) || 64;
    const spare = (main.height - reserved) - w * 22 / 12;
    const btn = Math.round(Math.max(64, Math.min(88, cur + spare)));
    if (btn !== cur) {
      document.documentElement.style.setProperty('--btn-h', btn + 'px');
      if (again) sizeField(false);
    }
  }
  addEventListener('resize', () => requestAnimationFrame(sizeField));
  addEventListener('orientationchange', () => setTimeout(sizeField, 350));
  sizeField();

  app.bindHold($('bL'), app.act.left);
  app.bindHold($('bR'), app.act.right);
  app.bindHold($('bD'), app.act.soft);
  app.bindHold($('bRot'), app.act.rotate, { repeat: false });
  app.bindHold($('bDrop'), app.act.drop, { repeat: false });

  const showMute = () => { $('muteBtn').innerHTML = RB.sound.muted ? '&#128263;' : '&#128264;'; $('muteBtn').setAttribute('aria-pressed', RB.sound.muted); };
  $('muteBtn').addEventListener('click', () => { RB.sound.setMuted(!RB.sound.muted); showMute(); RB.sound.play('rotate'); });
  showMute();
  $('log').addEventListener('click', () => $('partyBtn').click());
  $('watchLeave').addEventListener('click', () => app.leaveWatch());
  $('partyBtn').addEventListener('click', () => { $('party').classList.add('open'); $('partyBtn').classList.remove('unread'); });
  $('partyClose').addEventListener('click', () => $('party').classList.remove('open'));
  $('chatForm').addEventListener('submit', e => { e.preventDefault(); app.act.say($('chatIn').value); $('chatIn').value = ''; });
})();
</script>
</body>
</html>
